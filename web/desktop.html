<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>mneme · 桌面</title>
<link rel="stylesheet" href="/desktop.css" />
</head>
<body>
<header>
  <h1>mneme<span class="muted" id="state"></span></h1>
  <div class="hint">
    <kbd>/</kbd>检索 <kbd>j/k</kbd>移动 <kbd>Enter</kbd>详情 <kbd>[ ]</kbd>切视图 <kbd>Ctrl+Enter</kbd>保存 <kbd>Esc</kbd>收起
    <button id="density" class="ghost" title="切换紧凑/舒适密度">紧凑</button>
    <button id="create" class="ghost">＋ 新建</button>
  </div>
</header>

<main>
  <aside id="side">
    <input type="text" id="q" placeholder="检索：功效 / 性味 / 拼音首字母（mh）" autocomplete="off" />
    <div class="muted" id="search-note">输入即搜；AND 无结果自动改 OR</div>
    <div id="views"></div>
    <div class="muted" id="meta"></div>

    <details id="sync-box">
      <summary>同步（GitHub 私有库）</summary>
      <div class="muted" id="sync-status">读取中…</div>
      <div class="sync-btns">
        <button id="sync-dry" class="ghost">预演</button>
        <button id="sync-run">立即同步</button>
      </div>
      <pre id="sync-out" class="muted"></pre>
      <div id="sync-form">
        <input id="sync-owner" placeholder="owner" autocomplete="off" />
        <input id="sync-repo" placeholder="repo" autocomplete="off" />
        <input id="sync-path" placeholder="仓库内路径（留空为根）" autocomplete="off" />
        <input id="sync-token" placeholder="token（留空 = 沿用已保存的）" type="password" autocomplete="off" />
        <button id="sync-save">保存配置并启用</button>
        <div class="muted">token 只写进本机数据目录的 sync.json，别提交或外传。</div>
      </div>
    </details>
  </aside>

  <section id="list-pane">
    <div class="muted" id="list-title"></div>
    <div id="list"></div>
  </section>

  <aside id="detail">
    <div class="muted">选择一条（Enter 或点击）查看详情</div>
  </aside>
</main>

<script src="/desktop.js"></script>
</body>
</html>
