[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
mneme-core = { path = "crates/mneme-core" }
mneme-store = { path = "crates/mneme-store" }
mneme-codec = { path = "crates/mneme-codec" }
mneme-sync = { path = "crates/mneme-sync" }
mneme-server = { path = "crates/mneme-server" }
mneme-upstream = { path = "crates/mneme-upstream" }
mneme-ffi = { path = "crates/mneme-ffi" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
rayon = "1"
memchr = "2"
parking_lot = "0.12"
criterion = { version = "0.5", features = ["html_reports"] }
mimalloc = { version = "0.1", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uniffi = { version = "0.29", features = ["cli"] }
# OCR（RapidOCR/PP-OCRv4 ONNX 模型本地推理）。
# 必须关掉 ort 默认的 download-binaries：构建期会去 github.com 拉 onnxruntime，
# 本机网络被阻断；改用 load-dynamic + 运行时指定 onnxruntime.dll（tools/fetch-ocr-models.py 下载）。
paddle-ocr-rs = { version = "0.6.1", default-features = false }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif"] }

# 性能清单 §1：release 全开。dev 保持增量编译速度，不套用这些选项。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
